<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>샘플몰 관리자</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #e3e5e8; --text: #1f2328; --muted: #6b7280;
    --brand: #2f6fed; --brand-dark: #1f56c4; --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { background: #1f2937; color: #fff; padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: #cbd5e1; font-size: 13px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  textarea { height: 64px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .inline { display: flex; gap: 14px; font-weight: normal; }
  .inline label { font-weight: normal; margin: 0; display: flex; align-items: center; gap: 4px; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer; }
  .primary { background: var(--brand); color: #fff; width: 100%; margin-top: 18px; font-weight: 600; }
  .primary:hover { background: var(--brand-dark); }
  .ghost { background: #eef0f3; color: var(--text); padding: 6px 10px; font-size: 12px; }
  .error { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: #f8f9fb; color: var(--muted); font-weight: 600; }
  td.num { text-align: right; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-head h2 { margin: 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e8f0fe; color: var(--brand-dark); }
  .badge.off { background: #f1f2f4; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  #toast { position: fixed; top: 64px; right: 24px; background: var(--ok); color: #fff; padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #login { max-width: 360px; margin: 80px auto; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .hidden { display: none !important; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>샘플몰 관리자</h1>
  <span id="whoami"></span>
</header>

<!-- 로그인 화면 -->
<section id="login" class="panel">
  <h2>관리자 로그인</h2>
  <form id="login-form">
    <label for="login-id">아이디</label>
    <input type="text" id="login-id" autocomplete="off">
    <label for="login-pw">비밀번호</label>
    <input type="password" id="login-pw">
    <button type="submit" class="primary" id="login-btn">로그인</button>
    <div class="error" id="login-error"></div>
  </form>
  <p class="hint">시연용 계정: admin / 1234</p>
</section>

<!-- 상품 등록 화면 -->
<main id="app" class="hidden">
  <section class="panel">
    <h2>상품 등록</h2>
    <form id="product-form" novalidate>
      <label for="name">상품명</label>
      <input type="text" id="name" name="name">

      <label for="category">카테고리</label>
      <select id="category" name="category">
        <option value="">선택하세요</option>
        <option>의류</option>
        <option>잡화</option>
        <option>식품</option>
        <option>생활용품</option>
        <option>전자기기</option>
      </select>

      <div class="row">
        <div>
          <label for="price">판매가(원)</label>
          <input type="number" id="price" name="price">
        </div>
        <div>
          <label for="stock">재고(개)</label>
          <input type="number" id="stock" name="stock">
        </div>
      </div>

      <label>배송 방식</label>
      <div class="inline">
        <label><input type="radio" name="shipping" value="택배" checked> 택배</label>
        <label><input type="radio" name="shipping" value="퀵"> 퀵</label>
        <label><input type="radio" name="shipping" value="직접수령"> 직접수령</label>
      </div>

      <label>판매 설정</label>
      <div class="inline">
        <label><input type="checkbox" id="on-sale" name="onSale"> 등록 즉시 판매 시작</label>
      </div>

      <label for="desc">상품 설명</label>
      <textarea id="desc" name="desc"></textarea>

      <button type="submit" class="primary" id="submit-btn">등록하기</button>
      <div class="error" id="form-error"></div>
    </form>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>등록된 상품 <span id="count" class="badge">0</span></h2>
      <button class="ghost" id="reset-btn" type="button">목록 비우기</button>
    </div>
    <table>
      <thead>
        <tr><th>번호</th><th>상품명</th><th>카테고리</th><th>판매가</th><th>재고</th><th>배송</th><th>상태</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </section>
</main>

<div id="toast"></div>

<script>
  // 시연용 페이지: 데이터는 이 브라우저의 localStorage에만 저장됩니다.
  const KEY = "samplemall-products";
  const $ = (id) => document.getElementById(id);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
  }
  function won(n) { return Number(n).toLocaleString("ko-KR") + "원"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render() {
    const items = load();
    $("count").textContent = items.length;
    $("list").innerHTML = items.length
      ? items.map((p, i) => `<tr>
          <td>${i + 1}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td>
          <td class="num">${won(p.price)}</td><td class="num">${p.stock}</td><td>${esc(p.shipping)}</td>
          <td><span class="badge ${p.onSale ? "" : "off"}">${p.onSale ? "판매중" : "대기"}</span></td>
        </tr>`).join("")
      : `<tr><td colspan="7" class="empty">아직 등록된 상품이 없습니다.</td></tr>`;
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 1200);
  }

  $("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if ($("login-id").value === "admin" && $("login-pw").value === "1234") {
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("whoami").textContent = "admin 님";
      render();
    } else {
      $("login-error").textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
    }
  });

  $("product-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    const p = {
      name: $("name").value.trim(),
      category: $("category").value,
      price: $("price").value,
      stock: $("stock").value,
      shipping: f.querySelector("input[name=shipping]:checked").value,
      onSale: $("on-sale").checked,
      desc: $("desc").value.trim(),
    };
    let err = "";
    if (!p.name) err = "상품명을 입력하세요.";
    else if (!p.category) err = "카테고리를 선택하세요.";
    else if (!p.price || Number(p.price) <= 0) err = "판매가를 올바르게 입력하세요.";
    else if (p.stock === "" || Number(p.stock) < 0) err = "재고를 올바르게 입력하세요.";
    $("form-error").textContent = err;
    if (err) return;

    const items = load();
    items.push(p);
    save(items);
    render();
    f.reset();
    toast("등록 완료: " + p.name);
  });

  $("reset-btn").addEventListener("click", () => {
    if (confirm("등록된 상품을 모두 지울까요?")) { save([]); render(); }
  });
</script>
</body>
</html>
